<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input 태그!</title>
</head>
<body>
    <fieldset>
        <legend>회원가입</legend>
        <div>
            <!-- input 태그의 기본 type은 text (생략 가능) -->
            <!-- label : 글자만 클릭해도 text 선택 됨 -->
            <!-- autofocus : 따로 클릭 안해도 text 안에 바로 입력할 수 있게 포커스 -->
            <!-- placeholder : 입력하기 전에 알려주는 글 -->
            <label>ID : <input type="text" autofocus placeholder="아이디를 입력해주세요"></label>
            <input type="button" value="중복체크">
        </div>
        <div>
            <label>Password : <input type="password" placeholder="비밀번호를 입력해주세요"></label>
        </div>
        <div>
            <!-- 나중에 정규식으로 대체 할 예정 -->
            <label>Email : <input type="email"></label>
        </div>
        <div>
            <!-- name : 이거 해야지 중복 체크 안됨 -->
            <!-- checked : 체크 된 상태로 두기 -->
            Gender : 
            <label><input type="radio" name="gender">남자</label>
            <label><input type="radio" name="gender" checked>여자</label>
        </div>
        <div>
            취미 :
            <label><input type="checkbox" checked>코딩</label>
            <label><input type="checkbox">게임</label>
            <label><input type="checkbox" checked>독서</label>
            <label><input type="checkbox">영화감상</label>
            <label><input type="checkbox">운동</label>
        </div>
        <div>
            <!-- accept : 확장자 제한 -->
            <!-- multiple : 여러 파일 선택 -->
            프로필 이미지 :
            <input type="file" accept=".jpg" multiple>
        </div>
        <div>
            <!-- 드랍 다운 형태 -->
            나이대 :
            <select> 
                <option>:: 선택 ::</option>
                <option>10대</option>
                <option>20대</option>
                <option>30대</option>
                <option>40대</option>
                <option>50대</option>
                <option>60대 이상</option>
            </select>
        </div>
        <div>
            자기소개 :
            <div>
                <textarea rows="4" cols="30" placeholder="자기소개 입력"></textarea>
            </div>
        </div>
        <div>
            <!-- submit 과 reset 은 나중에 form 태그와 연계해서 사용(jsp) -->
            <!-- input 버튼과 버튼 태그는 큰 차이가 없음 -->
            <input type="submit">
            <input type="button" value="회원가입">
            <button>회원가입</button>
            <input type="reset">
        </div>
    </fieldset>
</body>
</html>
